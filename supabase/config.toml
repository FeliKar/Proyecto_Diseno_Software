project_id = "mesa-cerca"

[functions.restaurants]
# La sesión se verifica dentro de la función con Supabase Auth.
verify_jwt = false
entrypoint = "./functions/restaurants/index.ts"

[functions.saved-restaurants]
# The function verifies the session before accessing user data.
verify_jwt = false
entrypoint = "./functions/saved-restaurants/index.ts"

[functions.search-history]
# The function checks the session and uses the caller's database permissions.
verify_jwt = false
entrypoint = "./functions/search-history/index.ts"

[functions.sharing]
# Link management requires a session verified inside the function.
verify_jwt = false
entrypoint = "./functions/sharing/index.ts"

[functions.shared-list]
# Public read-only access requires a valid active share token.
verify_jwt = false
entrypoint = "./functions/shared-list/index.ts"
